name: Plugin Checks

on:
  push:
  pull_request:

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run check
      - run: node --check calendar/assets/recurrence.js && node --check calendar/assets/series.js
      - run: git ls-files -z '*.php' | xargs -0 -n1 php -l
      - run: php qa/test-recurrence.php
